[package]
name = "s-b-macro-launchpad"
version = "0.2.0-s-b.1"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
futures-util = "0.3.34"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Memory",
] }
