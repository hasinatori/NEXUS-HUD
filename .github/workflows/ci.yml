# Zweck: CI für das NEXUS HUD. Doku, Projektstruktur und die Phase-1-Stubs
# (Go, Node/TS, Rust) bleiben damit grün.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdown-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24

  check-schema:
    name: Schema-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: JSON-Schema validieren
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('schema/*.json')]; print('Alle JSON-Dateien in schema/ sind gültig.')"
      - name: Schema-Test (Beispiel-Payloads)
        run: |
          pip install --quiet jsonschema
          python tests/schema/validate_events.py
      - name: Schema-Generierung konsistent (Bus-Embed)
        run: |
          python3 scripts/generate-schema.py
          git diff --exit-code

  structure-check:
    name: Struktur-Check (S-A bis S-E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Modul-Ordner prüfen
        run: |
          for m in s-a-ui-shell s-b-macro-launchpad s-c-automation s-d-integrations s-e-monitor; do
            test -d "services/$m" || { echo "FEHLT: services/$m"; exit 1; }
            test -f "services/$m/README.md" || { echo "FEHLT: services/$m/README.md"; exit 1; }
          done
          echo "Alle Modul-Ordner vorhanden."
      - name: Kern-Dateien prüfen
        run: |
          for f in README.md ARCHITECTURE.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md schema/events.schema.json VERSION.json; do
            test -f "$f" || { echo "FEHLT: $f"; exit 1; }
          done
          echo "Kern-Dateien vorhanden."

  version-check:
    name: Version-Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Versionen prüfen
        run: python3 scripts/check-version.py

  go:
    name: Go (Bus, S-C, S-E, HUD, hello-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...

  dotnet:
    name: C# (S-A Bus + ViewModels headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Headless-Tests (xunit)
        working-directory: tests/s-a-ui-shell
        run: dotnet test

  e2e:
    name: E2E (Bus + S-E + S-C + Prototype-HUD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: Binaries bauen
        run: |
          mkdir -p /tmp/nexus-e2e
          go build -o /tmp/nexus-e2e/ ./cmd/bus ./services/s-e-monitor ./services/s-c-automation ./scripts/prototype-hud
      - name: S-C-Konfiguration anlegen
        run: |
          mkdir -p /tmp/nexus-inbox
          cat > /tmp/nexus-automations.json <<'EOF'
          {
            "tasks": {
              "echo-ok": {"command": ["sh", "-c", "echo OK"], "timeout_ms": 10000},
              "fail-task": {"command": ["sh", "-c", "exit 4"], "timeout_ms": 10000}
            },
            "watchers": [
              {"path": "/tmp/nexus-inbox", "triggers": ["created"], "then": "echo-ok"}
            ]
          }
          EOF
      - name: End-to-End-Test
        run: |
          set -e
          BUS_PID=""
          SE_PID=""
          SC_PID=""
          trap 'kill $BUS_PID $SE_PID $SC_PID 2>/dev/null || true' EXIT
          /tmp/nexus-e2e/bus >/tmp/nexus-bus.log 2>&1 &
          BUS_PID=$!
          sleep 1
          /tmp/nexus-e2e/s-e-monitor -metrics-interval 2s -git-dir "$GITHUB_WORKSPACE" -git-interval 3s \
            -build-log /tmp/nexus-build.log -build-project ci >/tmp/nexus-se.log 2>&1 &
          SE_PID=$!
          /tmp/nexus-e2e/s-c-automation -config /tmp/nexus-automations.json >/tmp/nexus-sc.log 2>&1 &
          SC_PID=$!
          sleep 3
          /tmp/nexus-e2e/prototype-hud -test -window 10s \
            -cmd cmd.automation.run -cmd-params '{"task":"fail-task"}' \
            -expect "event.system.hello:bus,event.system.metrics:S-E,event.git.status:S-E,event.build.failed:S-E,event.automation.started:S-C,event.automation.finished:S-C,event.file.changed:S-C" &
          HUD_PID=$!
          sleep 3
          echo "src/main.go:12: error: undefined: foo" >> /tmp/nexus-build.log
          echo "neu" > /tmp/nexus-inbox/datei.txt
          wait "$HUD_PID"
          echo "E2E erfolgreich: alle erwarteten Events empfangen."

  node:
    name: Node/TS (S-D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/s-d-integrations/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: services/s-d-integrations
        run: npm ci
      - name: TypeScript-Typen prüfen
        working-directory: services/s-d-integrations
        run: npm run typecheck
      - name: Tests (Mock-Server, kein Netz/keine Credentials)
        working-directory: services/s-d-integrations
        run: npm test

  rust:
    name: Rust (S-B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Rust build
        working-directory: services/s-b-macro-launchpad
        run: cargo build --locked
      - name: Rust test
        working-directory: services/s-b-macro-launchpad
        run: cargo test

  vscode:
    name: VS Code-Erweiterung (IDE-Bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/vscode-nexus/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: extensions/vscode-nexus
        run: npm ci
      - name: Tests (Fokus-Logik, headless)
        working-directory: extensions/vscode-nexus
        run: npm test
