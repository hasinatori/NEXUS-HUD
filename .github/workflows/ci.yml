# Zweck: CI für das NEXUS HUD. Doku, Projektstruktur und die Phase-1-Stubs
# (Go, Node/TS, Rust) bleiben damit grün.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdown-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24

  check-schema:
    name: Schema-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: JSON-Schema validieren
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('schema/*.json')]; print('Alle JSON-Dateien in schema/ sind gültig.')"
      - name: Schema-Test (Beispiel-Payloads)
        run: |
          pip install --quiet jsonschema
          python tests/schema/validate_events.py

  structure-check:
    name: Struktur-Check (S-A bis S-E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Modul-Ordner prüfen
        run: |
          for m in s-a-ui-shell s-b-macro-launchpad s-c-automation s-d-integrations s-e-monitor; do
            test -d "services/$m" || { echo "FEHLT: services/$m"; exit 1; }
            test -f "services/$m/README.md" || { echo "FEHLT: services/$m/README.md"; exit 1; }
          done
          echo "Alle Modul-Ordner vorhanden."
      - name: Kern-Dateien prüfen
        run: |
          for f in README.md ARCHITECTURE.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md schema/events.schema.json; do
            test -f "$f" || { echo "FEHLT: $f"; exit 1; }
          done
          echo "Kern-Dateien vorhanden."

  go:
    name: Go (Bus, S-C, S-E, hello-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...

  node:
    name: Node/TS (S-D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/s-d-integrations/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: services/s-d-integrations
        run: npm ci
      - name: TypeScript-Typen prüfen
        working-directory: services/s-d-integrations
        run: npm run typecheck

  rust:
    name: Rust (S-B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Rust build
        working-directory: services/s-b-macro-launchpad
        run: cargo build --locked
